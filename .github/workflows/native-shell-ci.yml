name: Native Shell CI

on:
  push:
    paths:
      - "src/**"
      - "app.json"
      - "assets/images/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-shell-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "app.json"
      - "assets/images/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-shell-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
