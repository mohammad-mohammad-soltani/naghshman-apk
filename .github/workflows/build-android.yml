name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm test
          npm run lint
          npm run typecheck

      - name: Build signed Myket APK on GitHub runner
        env:
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts
        run: |
          eas build \
            --platform android \
            --profile myket \
            --non-interactive \
            --local \
            --output naghshman-myket.apk

      - name: Enforce 35–45 MiB APK budget
        run: npm run check:apk-size -- naghshman-myket.apk

      - name: Upload accepted Myket APK
        uses: actions/upload-artifact@v4
        with:
          name: naghshman-myket-apk
          path: naghshman-myket.apk
          if-no-files-found: error
