name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm test
          npm run lint
          npm run typecheck

      - name: Build Myket APK on EAS servers
        id: eas-build
        run: |
          eas build \
            --platform android \
            --profile myket \
            --non-interactive \
            --wait \
            --json > eas-build.json
          artifact_url="$(jq -er 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' eas-build.json)"
          curl --fail --location --retry 3 "$artifact_url" --output naghshman-myket.apk

      - name: Enforce 35–45 MiB APK budget
        run: npm run check:apk-size -- naghshman-myket.apk

      - name: Upload accepted Myket APK
        uses: actions/upload-artifact@v4
        with:
          name: naghshman-myket-apk
          path: naghshman-myket.apk
          if-no-files-found: error
